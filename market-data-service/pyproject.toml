[project]
name = "market-data-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiocsv>=1.4.1",
    "aiofiles>=25.1.0",
    "apscheduler>=3.11.3",
    "asyncio>=4.0.0",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "orjson>=3.11.9",
    "pympler>=1.1",
    "psutil>=7.2.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "tenacity>=9.1.4",
    "uvicorn>=0.51.0",
    "websockets>=16.1",
    "dhanhq>=2.2.0",
    "aiokafka>=0.14.0",
    "ruff>=0.15.21",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.21",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
